<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Reservations</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f9fafb; color: #111827; padding: 24px; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 20px; }
    h2 { font-size: 1.1rem; font-weight: 600; margin-bottom: 16px; color: #374151; }
    table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
    th { text-align: left; padding: 8px 12px; background: #f3f4f6; color: #6b7280; font-weight: 500; }
    td { padding: 8px 12px; border-top: 1px solid #f3f4f6; }
    tr:hover td { background: #f9fafb; }
    .status { display: inline-block; font-size: 0.75rem; padding: 2px 8px; border-radius: 9999px; font-weight: 500; }
    .status-confirmed { background: #d1fae5; color: #065f46; }
    .status-pending { background: #fef3c7; color: #92400e; }
    .status-cancelled { background: #fee2e2; color: #991b1b; }
    #state { padding: 40px; text-align: center; color: #6b7280; }
    #state.error { color: #dc2626; }
    #refreshBtn { margin-top: 16px; font-size: 0.875rem; padding: 6px 14px; background: #3b82f6;
                  color: #fff; border: none; border-radius: 6px; cursor: pointer; }
    #refreshBtn:hover { background: #2563eb; }
    .meta { margin-top: 12px; font-size: 0.75rem; color: #9ca3af; text-align: right; }
  </style>
</head>
<body>

<div class="card">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
    <h2>Live Reservations — reservations_summary</h2>
    <button id="refreshBtn">Refresh</button>
  </div>
  <div id="state">Loading…</div>
  <div id="tableWrap" style="display:none">
    <table>
      <thead>
        <tr>
          <th>Destination</th>
          <th>Status</th>
          <th>Month</th>
          <th>Count</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <p class="meta" id="meta"></p>
  </div>
</div>

<script>
  // postMessage-based data bridge.
  // This iframe runs with sandbox="allow-scripts" (no allow-same-origin), so it cannot
  // carry the parent's session cookie. Instead, it asks the authenticated parent to
  // perform queries and relay the results.

  let pendingRequests = {};
  let requestCounter = 0;

  function query(view, params) {
    return new Promise((resolve, reject) => {
      const requestId = String(++requestCounter);
      pendingRequests[requestId] = { resolve, reject };

      // Timeout in case the parent never responds
      setTimeout(() => {
        if (pendingRequests[requestId]) {
          delete pendingRequests[requestId];
          reject(new Error('Request timed out'));
        }
      }, 15000);

      window.parent.postMessage({ type: 'query', view, params: params || {}, requestId }, '*');
    });
  }

  window.addEventListener('message', function(event) {
    const { type, requestId, data, error } = event.data || {};
    if (type !== 'query-result' && type !== 'query-error') return;
    const pending = pendingRequests[requestId];
    if (!pending) return;
    delete pendingRequests[requestId];
    if (type === 'query-result') pending.resolve(data);
    else pending.reject(new Error(error || 'Query failed'));
  });

  function statusClass(s) {
    if (!s) return '';
    const lower = s.toLowerCase();
    if (lower === 'confirmed') return 'status-confirmed';
    if (lower === 'pending') return 'status-pending';
    if (lower === 'cancelled' || lower === 'canceled') return 'status-cancelled';
    return '';
  }

  async function load() {
    const stateEl = document.getElementById('state');
    const tableWrap = document.getElementById('tableWrap');
    const tbody = document.getElementById('tbody');
    const meta = document.getElementById('meta');

    stateEl.className = '';
    stateEl.style.display = 'block';
    stateEl.textContent = 'Loading…';
    tableWrap.style.display = 'none';

    try {
      const rows = await query('reservations_summary');

      if (!rows || rows.length === 0) {
        stateEl.textContent = 'No data returned.';
        return;
      }

      tbody.innerHTML = '';
      for (const row of rows) {
        const tr = document.createElement('tr');
        tr.innerHTML = [
          row.destination ?? '—',
          row.status
            ? `<span class="status ${statusClass(row.status)}">${row.status}</span>`
            : '—',
          row.month ? row.month.slice(0, 7) : '—',
          row.count ?? '—',
        ].map(v => `<td>${v}</td>`).join('');
        tbody.appendChild(tr);
      }

      meta.textContent = `${rows.length} rows · fetched ${new Date().toLocaleTimeString()}`;
      stateEl.style.display = 'none';
      tableWrap.style.display = 'block';

    } catch (err) {
      stateEl.className = 'error';
      stateEl.textContent = 'Error: ' + (err.message || 'Could not load data');
    }
  }

  document.getElementById('refreshBtn').addEventListener('click', load);
  load();
</script>
</body>
</html>
