<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test Table</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f9fafb; color: #111827; padding: 24px; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 20px; }
    h2 { font-size: 1.1rem; font-weight: 600; margin-bottom: 16px; color: #374151; }
    table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
    th { text-align: left; padding: 8px 12px; background: #f3f4f6; color: #6b7280; font-weight: 500; }
    td { padding: 8px 12px; border-top: 1px solid #f3f4f6; font-family: monospace; }
    #state { padding: 40px; text-align: center; color: #6b7280; }
    #state.error { color: #dc2626; }
    .meta { margin-top: 12px; font-size: 0.75rem; color: #9ca3af; text-align: right; }
  </style>
</head>
<body>
<div class="card">
  <h2>test_entries</h2>
  <div id="state">Loading…</div>
  <div id="tableWrap" style="display:none">
    <table>
      <thead><tr><th>id</th><th>created_at</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    <p class="meta" id="meta"></p>
  </div>
</div>

<script>
  let reqId = 0;
  const pending = {};

  function query(view) {
    return new Promise((resolve, reject) => {
      const id = String(++reqId);
      pending[id] = { resolve, reject };
      setTimeout(() => {
        if (pending[id]) { delete pending[id]; reject(new Error('Timed out')); }
      }, 15000);
      window.parent.postMessage({ type: 'query', view, params: {}, requestId: id }, '*');
    });
  }

  window.addEventListener('message', function(e) {
    const { type, requestId, data, error } = e.data || {};
    if (type !== 'query-result' && type !== 'query-error') return;
    const p = pending[requestId];
    if (!p) return;
    delete pending[requestId];
    type === 'query-result' ? p.resolve(data) : p.reject(new Error(error));
  });

  async function load() {
    const state = document.getElementById('state');
    const wrap = document.getElementById('tableWrap');
    state.className = '';
    state.style.display = 'block';
    state.textContent = 'Loading…';
    wrap.style.display = 'none';

    try {
      const rows = await query('test_entries');
      const tbody = document.getElementById('tbody');
      tbody.innerHTML = '';
      for (const row of (rows || [])) {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${row.id}</td><td>${row.created_at}</td>`;
        tbody.appendChild(tr);
      }
      document.getElementById('meta').textContent =
        `${(rows || []).length} row(s) · ${new Date().toLocaleTimeString()}`;
      state.style.display = 'none';
      wrap.style.display = 'block';
    } catch (err) {
      state.className = 'error';
      state.textContent = 'Error: ' + err.message;
    }
  }

  load();
</script>
</body>
</html>
